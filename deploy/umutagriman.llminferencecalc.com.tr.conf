server {
    listen 80;
    listen [::]:80;
    server_name umutagriman.llminferencecalc.com.tr;

    if ($host = umutagriman.llminferencecalc.com.tr) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name umutagriman.llminferencecalc.com.tr;

    ssl_certificate /etc/letsencrypt/live/umutagriman.llminferencecalc.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umutagriman.llminferencecalc.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}